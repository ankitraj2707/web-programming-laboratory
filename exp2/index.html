<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsive Student Registration Form using HTML5 and CSS3"
    />
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="form-header">
        <h1>Student Registration</h1>
        <p>Please fill in all required fields to complete your enrollment.</p>
      </header>

      <form action="#" method="POST" class="registration-form" novalidate>
        <!-- Personal Details Section -->
        <fieldset class="form-group-fieldset">
          <legend>Personal Details</legend>
          <div class="grid-layout">
            <div class="form-control">
              <label for="fullName"
                >Full Name <span class="required">*</span></label
              >
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="e.g., Ankit Raj"
                required
                minlength="2"
                pattern="[A-Za-z\s]+"
                title="Only letters and spaces are allowed"
              />
            </div>

            <div class="form-control">
              <label for="enrollmentNo"
                >Enrollment No. <span class="required">*</span></label
              >
              <input
                type="text"
                id="enrollmentNo"
                name="enrollmentNo"
                placeholder="e.g., AJU/240790"
                required
                pattern="[A-Za-z0-9/_-]{6,15}"
                title="Alpha-numeric format (6 to 15 characters)"
              />
            </div>

            <div class="form-control">
              <label for="dob"
                >Date of Birth <span class="required">*</span></label
              >
              <input
                type="date"
                id="dob"
                name="dob"
                required
                min="1990-01-01"
                max="2012-12-31"
              />
            </div>

            <div class="form-control">
              <span class="label-heading"
                >Gender <span class="required">*</span></span
              >
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="gender" value="male" required />
                  Male
                </label>
                <label class="radio-label">
                  <input type="radio" name="gender" value="female" /> Female
                </label>
                <label class="radio-label">
                  <input type="radio" name="gender" value="other" /> Other
                </label>
              </div>
            </div>
          </div>
        </fieldset>

        <!-- Academic Details Section -->
        <fieldset class="form-group-fieldset">
          <legend>Academic Information</legend>
          <div class="grid-layout">
            <div class="form-control">
              <label for="course"
                >Course / Program <span class="required">*</span></label
              >
              <select id="course" name="course" required>
                <option value="" disabled selected>-- Select Course --</option>
                <option value="btech_cse">
                  B.Tech - Computer Science &amp; Engineering
                </option>
                <option value="btech_ece">
                  B.Tech - Electronics &amp; Communication
                </option>
                <option value="bca">
                  Bachelor of Computer Applications (BCA)
                </option>
                <option value="mca">
                  Master of Computer Applications (MCA)
                </option>
                <option value="mtech_cse">M.Tech - Computer Science</option>
              </select>
            </div>

            <div class="form-control">
              <label for="semester"
                >Semester <span class="required">*</span></label
              >
              <input
                type="number"
                id="semester"
                name="semester"
                placeholder="e.g., 5"
                min="1"
                max="8"
                required
              />
            </div>
          </div>
        </fieldset>

        <!-- Contact & Communication Details Section -->
        <fieldset class="form-group-fieldset">
          <legend>Contact Information</legend>
          <div class="grid-layout">
            <div class="form-control">
              <label for="email"
                >Email Address <span class="required">*</span></label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@domain.com"
                required
              />
            </div>

            <div class="form-control">
              <label for="mobile"
                >Mobile Number <span class="required">*</span></label
              >
              <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="10-digit mobile number"
                pattern="[0-9]{10}"
                required
                title="Please enter a valid 10-digit phone number"
              />
            </div>

            <div class="form-control full-width">
              <label for="address"
                >Permanent Address <span class="required">*</span></label
              >
              <textarea
                id="address"
                name="address"
                rows="3"
                placeholder="Street address, City, State, PIN"
                required
                minlength="10"
              ></textarea>
            </div>
          </div>
        </fieldset>

        <!-- Form Action Buttons -->
        <div class="button-group">
          <button type="reset" class="btn btn-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">
            Submit Registration
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
